databases:
  - name: travelmatch-db
    databaseName: travelmatch
    plan: free

services:
  - type: web
    name: travelmatch-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: travelmatch-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://aldijanaa.github.io/AI-Driven-SE-Project
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: N8N_WEBHOOK_URL
        sync: false
