databases:
  - name: travelmatch-db
    databaseName: travelmatch
    plan: free

services:
  - type: web
    name: travelmatch-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: travelmatch-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://travelmatch-frontend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_PASSWORD_RESET_WEBHOOK_URL
        sync: false
      - key: N8N_VERIFICATION_WEBHOOK_URL
        sync: false

  - type: web
    name: travelmatch-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://travelmatch-backend.onrender.com/api
